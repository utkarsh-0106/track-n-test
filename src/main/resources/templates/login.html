<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DSA Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black min-h-screen flex items-center justify-center text-gray-100">

    <div class="bg-gray-800/90 p-10 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700 backdrop-blur-md">
        
        <h1 class="text-3xl font-extrabold mb-2 text-center text-blue-400 tracking-wide">Welcome Back 👋</h1>
        <p class="text-center text-gray-400 mb-8">Login to continue tracking your DSA journey</p>

        
        <div th:if="${param.logout}" 
             class="bg-green-900/50 border border-green-600 text-green-400 text-center py-2 rounded-lg mb-4 text-sm">
            ✅ You have been logged out successfully.
        </div>

        <div th:if="${param.error}" 
             class="bg-red-900/50 border border-red-600 text-red-400 text-center py-2 rounded-lg mb-4 text-sm">
            ❌ Invalid username or password.
        </div>

        
        <form th:action="@{/login}" method="post" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium mb-1 text-gray-300">Username</label>
                <input type="text" id="username" name="username" required
                       placeholder="Enter your username"
                       class="w-full px-4 py-2 rounded-lg bg-gray-900/80 border border-gray-700 
                              focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium mb-1 text-gray-300">Password</label>
                <input type="password" id="password" name="password" required
                       placeholder="Enter your password"
                       class="w-full px-4 py-2 rounded-lg bg-gray-900/80 border border-gray-700 
                              focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-500">
            </div>

            <button type="submit"
                    class="w-full py-2 rounded-lg bg-blue-600 hover:bg-blue-700 transition duration-200 font-semibold text-white">
                Sign In
            </button>
        </form>

        
        <div class="flex items-center my-6">
            <div class="flex-1 border-t border-gray-700"></div>
            <span class="px-3 text-gray-500 text-sm">OR</span>
            <div class="flex-1 border-t border-gray-700"></div>
        </div>

        
        <a href="/oauth2/authorization/google"
           class="w-full flex items-center justify-center gap-3 bg-red-600 hover:bg-red-700 py-2 rounded-lg text-white font-medium transition duration-200">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Sign in with Google
        </a>

        
        <p class="text-sm text-gray-400 text-center mt-6">
            Don’t have an account? 
            <a href="/signup" class="text-blue-400 hover:underline font-medium">Create one</a>
        </p>
    </div>

</body>
</html>
