<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quiz Result - Track n Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f6f8fa;
            color: #222;
            margin: 0;
            padding: 40px;
        }

        .result-container {
            max-width: 600px;
            background: white;
            margin: 0 auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #0074d9;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin: 8px 0;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
        }

        .btn {
            background-color: #0074d9;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 25px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #005fa3;
        }

        .footer {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            padding: 10px 22px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            }

        .btn-primary:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
<div class="result-container">
    <h1>Quiz Completed 🎯</h1>

    <p>Your total score is:</p>
    <p class="score" th:text="${score} + ' / ' + ${total}"></p>

    <p th:if="${score > (total / 2) and score < total}" style="color:#f0ad4e;">Good job! Keep practicing 🔥</p>
    <p th:if="${score <= (total / 2)}" style="color:#dc3545;">Keep learning and improving 🚀</p>

    <div class="footer">© Track n Test</div>
</div>
</body>
</html>
