<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Track n Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #001f3f, #0074d9);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        header {
            margin-top: 60px;
        }

        img {
            width: 130px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 4rem;
            margin: 15px 0 10px;
            font-weight: 700;
        }

        h2 {
            font-weight: 400;
            color: #f0f0f0;
            font-size: 1.3rem;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 40px;
            font-size: 1.4rem;
            color: white;
            background: linear-gradient(90deg, #ff851b, #ffdc00);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.3);
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #ffdc00, #ff851b);
            color: #111;
        }

        footer {
            margin-bottom: 30px;
        }

        .team {
            margin-top: 40px;
            font-size: 2rem;
            color: #dcdcdc;
        }

        .team span {
            display: block;
            margin: 5px 0;
            font-weight: 500;
        }

        .glow {
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ff851b, 0 0 10px #ffdc00, 0 0 20px #ffdc00;
            }
            to {
                text-shadow: 0 0 15px #ffdc00, 0 0 25px #ff851b, 0 0 40px #ff851b;
            }
        }
    </style>
</head>

<body>
    <header>
        <img src="/images/logo.png" alt="Track n Test Logo">
        <h1 class="glow">Track n Test</h1>
    </header>

    <main>
        <button onclick="location.href='/signup'">Proceed</button>

        <div class="team">
            <p><strong>Team Members:</strong></p>
            <span>Utkarsh Maheshwari</span>
            <span>Yashswee</span>
            <span>Tarang Singhal</span>
            <span>Shubham Kumar</span>
            <span>Satyendra Prajapati</span>
        </div>
    </main>

    <footer>
        <p>© 2025 Track n Test | All Rights Reserved</p>
    </footer>
</body>
</html>
