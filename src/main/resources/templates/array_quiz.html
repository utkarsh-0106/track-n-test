<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Array Quiz - Track n Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f6f8fa;
            color: #222;
            margin: 0;
            padding: 40px;
        }
        .quiz-container {
            max-width: 700px;
            background: white;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0074d9;
        }
        .question {
            margin-bottom: 25px;
        }
        button {
            background-color: #0074d9;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #005fa3;
        }
    </style>
</head>
<body>
<div class="quiz-container">
    <h1>Array Quiz</h1>

    <form th:action="@{/quiz/submit}" method="post">
        <div th:each="q, iterStat : ${questions}" class="question">
            <p><strong th:text="${iterStat.index + 1} + '. ' + ${q.questionText}"></strong></p>
            <div>
                <label><input type="radio" th:name="'answer_' + ${q.id}" th:value="${q.optionA}"> <span th:text="${q.optionA}"></span></label><br>
                <label><input type="radio" th:name="'answer_' + ${q.id}" th:value="${q.optionB}"> <span th:text="${q.optionB}"></span></label><br>
                <label><input type="radio" th:name="'answer_' + ${q.id}" th:value="${q.optionC}"> <span th:text="${q.optionC}"></span></label><br>
                <label><input type="radio" th:name="'answer_' + ${q.id}" th:value="${q.optionD}"> <span th:text="${q.optionD}"></span></label>
            </div>
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</div>
</body>

</html>
